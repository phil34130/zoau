<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Managing files in a PDS using Node.js with zoau</title>
  <!-- CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
</head>
<body>

<div class="container-sm" style="max-width: 740px;">

<div class=" g-3 mb-3">
  <div class="row">
    <div class="col-12 text-center"><h2>Managing files in a PDS using Node.js with zoau</h2></div>
  </div>

  <div id="results" class="row" style="display: none;">
    <div class="col-12"><h4>Results:</h4></div>
    <div class="col-12">
      <pre id="output" style="border: 5px solid grey;"></pre>
    </div>
  </div>
</div>

<form class="row g-3 mb-3 bg-light border">
  <div class="col-12">
    <label for="pds" class="form-label">PDS</label>
    <input type="text" name="pds" id="pds" value="PRICHAR.PYTHON.JCL" class="form-control">
  </div>
  <div class="col-12 d-grid gap-2">
    <button type="button" onclick="listMembers()" class="btn btn-primary mb-3">List PDS Members</button>
    <button type="button" onclick="createMember()" class="btn btn-outline-success mb-3">Create New Member</button>
  </div>
</form>

<form class="row g-3 mb-3 bg-light border">
  <div class="col-12">
    <label for="members" class="form-label">Members</label>
    <select name="members" id="members" class="form-select"></select>
  </div>
  <div class="col-12 d-grid gap-2">
    <button type="button" onclick="getContent()" class="btn btn-primary mb-3">Read Member Content</button>
    <button type="button" onclick="deleteMember()" class="btn btn-outline-danger mb-3">Delete Selected Member</button>
  </div>
</form>

<form class="row g-3 mb-3 bg-light border">
  <div class="col-12">
    <label for="content" id="content-label" class="form-label">Content</label>
    <textarea name="content" id="content" rows="20" class="form-control"></textarea>
  </div>
  <div class="col-12 d-grid gap-2">
     <div style="font-size: 0.9em; color: #555;">
          Nom: <span id="job-name" style="font-weight:bold">---</span> |
          Owner: <span id="job-owner" style="font-weight:bold">---</span>
          JobID: <span id="job-id-display" style="font-weight:bold">---</span>
      </div>
    <button type="button" onclick="writeContent()" class="btn btn-primary mb-3">Save</button>
    <button type="button" onclick="submitJCL()" class="btn btn-warning mb-1">Submit JCL to JES</button>
    <button type="button" onclick="refreshStatus()">Etape 1 : Verifier Statut</button>
    <span id="job-rc" style="font-weight: bold; margin-left: 10px;">En attente...</span>

    <br><br>

    <button type="button" id="btn-output" onclick="checkStatus()" style="display:none; background-color: #28a745; color: white;">
        Etape 2 : Voir l'Output Complet
    </button>
    <button type="button" id="btn-purge" onclick="purgeJob()" class="btn-danger" style="display:none; margin-top: 10px;">
        Purger le Job
    </button>
    <pre id="output-display"></pre>
  </div>
</form>

</div>

<!-- Scripts. -->
<script src="script.js" type="text/javascript"></script>
</body>
</html>
